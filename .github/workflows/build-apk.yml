on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout Repository Code
      # ----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # ----------------------------------------------------------------
      # 2. Setup Node.js Environment
      # ----------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ----------------------------------------------------------------
      # 3. Install NPM Dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------------------------------
      # 4. Build Ionic Web Application
      # ----------------------------------------------------------------
      - name: Build Ionic app
        run: npm run build

      # ----------------------------------------------------------------
      # 5. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ----------------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ----------------------------------------------------------------
      # 7. Synchronize Capacitor with Android
      # ----------------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ----------------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # ----------------------------------------------------------------
      # 10. Build debug APK
      # ----------------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ----------------------------------------------------------------
      # 11. Rename the generated APK
      # ----------------------------------------------------------------
      - name: ionic-calculator.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IonicCalculator.apk

      # ----------------------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # ----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicCalculator-APK
          path: IonicCalculator.apk
          if-no-files-found: error
          retention-days: 30